<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" width="1100" height="340" fill="none">
  <defs>
    <marker id="arrowD" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#6366F1"/>
    </marker>
    <marker id="arrowCyanD" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
  </defs>

  <rect width="1100" height="340" rx="16" fill="#09090B" stroke="#27272A"/>

  <!-- Column 1: Client -->
  <g transform="translate(36, 48)">
    <rect width="240" height="244" rx="14" fill="#111116" stroke="#27272A"/>
    <text x="20" y="34" fill="#818CF8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600">CLIENT</text>
    <text x="20" y="58" fill="#FAFAFA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="600">Browser / Mobile</text>

    <rect x="18" y="80" width="204" height="42" rx="8" fill="#18181B" stroke="#27272A"/>
    <text x="32" y="105" fill="#E4E4E7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">HTTP / WebSocket UI</text>

    <rect x="18" y="134" width="204" height="42" rx="8" fill="#18181B" stroke="#27272A"/>
    <text x="32" y="159" fill="#E4E4E7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">HMAC Session Cookie</text>

    <rect x="18" y="188" width="204" height="42" rx="8" fill="#18181B" stroke="#27272A"/>
    <text x="32" y="213" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">HEAD / &amp; /login · 200 OK</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="276" y1="170" x2="346" y2="170" stroke="#6366F1" stroke-width="2" marker-end="url(#arrowD)"/>
  <text x="311" y="158" text-anchor="middle" fill="#A1A1AA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">:8888</text>

  <!-- Column 2: Bridge -->
  <g transform="translate(352, 32)">
    <rect width="340" height="276" rx="14" fill="#111116" stroke="#4F46E5" stroke-opacity="0.65"/>
    <text x="20" y="34" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600">SYSTEMD SERVICE</text>
    <text x="20" y="58" fill="#FAFAFA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="600">antigravity_web_bridge.py</text>

    <rect x="18" y="78" width="304" height="44" rx="8" fill="#18181B" stroke="#27272A"/>
    <text x="32" y="105" fill="#E4E4E7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">Login Gate (/login) &amp; CSRF Rewrite</text>

    <rect x="18" y="134" width="304" height="54" rx="8" fill="#18181B" stroke="#27272A"/>
    <text x="32" y="157" fill="#E4E4E7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="500">Disconnect-Resilient RPC Pipe</text>
    <text x="32" y="176" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">Drains mutation RPCs even if tab closes</text>

    <rect x="18" y="200" width="304" height="58" rx="8" fill="#18181B" stroke="#27272A"/>
    <text x="32" y="224" fill="#E4E4E7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="500">sync_watcher + Cascade Guard</text>
    <text x="32" y="243" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">Hot-swaps only when all cascades are idle</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="692" y1="130" x2="762" y2="130" stroke="#6366F1" stroke-width="2" marker-end="url(#arrowD)"/>
  <text x="727" y="118" text-anchor="middle" fill="#A1A1AA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">:19876</text>

  <!-- Column 3: Backend & Storage -->
  <g transform="translate(768, 32)">
    <rect width="296" height="128" rx="14" fill="#111116" stroke="#27272A"/>
    <text x="20" y="32" fill="#22C55E" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600">BLUE / GREEN BACKEND</text>
    <text x="20" y="56" fill="#FAFAFA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="600">language_server</text>
    <text x="20" y="80" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5">Primary :19876 · Standby :19877</text>
    <text x="20" y="102" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5">Zero-downtime state reload</text>
  </g>

  <line x1="916" y1="160" x2="916" y2="196" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrowCyanD)"/>

  <g transform="translate(768, 202)">
    <rect width="296" height="106" rx="14" fill="#111116" stroke="#27272A"/>
    <text x="20" y="32" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600">SHARED STATE</text>
    <text x="20" y="56" fill="#FAFAFA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" font-weight="600">~/.gemini/antigravity-cli</text>
    <text x="20" y="80" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5">Direct parity with agy CLI sessions</text>
  </g>
