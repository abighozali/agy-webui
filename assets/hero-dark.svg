<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" fill="none">
  <defs>
    <linearGradient id="bgD" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#09090B"/>
      <stop offset="50%" stop-color="#0F1018"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>
    <radialGradient id="glowD" cx="50%" cy="42%" r="48%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#38BDF8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#09090B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="markD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="55%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <pattern id="gridD" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="20" fill="url(#bgD)"/>
  <rect width="1200" height="360" rx="20" fill="url(#gridD)"/>
  <rect width="1200" height="360" rx="20" fill="url(#glowD)"/>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="19.5" stroke="#27272A"/>

  <!-- Emblem + Title -->
  <g transform="translate(600, 128)">
    <g transform="translate(-188, -46)">
      <rect x="0" y="0" width="72" height="72" rx="18" fill="#18181B" stroke="#2E2E38" stroke-width="1.5"/>
      <path d="M36 14L55 56H46L36 33.5L26 56H17L36 14Z" fill="url(#markD)"/>
      <circle cx="36" cy="49" r="4.2" fill="#38BDF8"/>
    </g>
    <text x="-94" y="4" fill="#FAFAFA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="-1.2">agy-webui</text>
  </g>

  <!-- Subtitle -->
  <text x="600" y="196" text-anchor="middle" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="400">
    Standalone, persistent WebUI bridge for Antigravity — decoupled from CLI session lifecycles
  </text>

  <!-- Feature Pills -->
  <g transform="translate(600, 256)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500">
    <g transform="translate(-376, -18)">
      <rect width="172" height="36" rx="18" fill="#18181B" stroke="#27272A"/>
      <circle cx="20" cy="18" r="4" fill="#22C55E"/>
      <text x="34" y="22.5" fill="#E4E4E7">Persistent Service</text>
    </g>
    <g transform="translate(-186, -18)">
      <rect width="166" height="36" rx="18" fill="#18181B" stroke="#27272A"/>
      <circle cx="20" cy="18" r="4" fill="#38BDF8"/>
      <text x="34" y="22.5" fill="#E4E4E7">Real-Time Sync</text>
    </g>
    <g transform="translate(-2, -18)">
      <rect width="204" height="36" rx="18" fill="#18181B" stroke="#27272A"/>
      <circle cx="20" cy="18" r="4" fill="#818CF8"/>
      <text x="34" y="22.5" fill="#E4E4E7">Disconnect-Resilient</text>
    </g>
    <g transform="translate(220, -18)">
      <rect width="156" height="36" rx="18" fill="#18181B" stroke="#27272A"/>
      <circle cx="20" cy="18" r="4" fill="#F59E0B"/>
      <text x="34" y="22.5" fill="#E4E4E7">Optional Auth Gate</text>
    </g>
